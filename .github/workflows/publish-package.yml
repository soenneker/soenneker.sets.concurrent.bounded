name: publish-package
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'test/**'

env:
    "PipelineEnvironment": true

permissions:
  contents: read

jobs:
  publish-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Get release notes from latest commit
        uses: soenneker/release-notes-from-commits@v2

      
      - name: Setting up build version
        run: |
          version=$(($GITHUB_RUN_NUMBER))
          echo "BUILD_VERSION=4.0.$version" >> ${GITHUB_ENV}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore tests
        run: dotnet restore test/Soenneker.Sets.Concurrent.Bounded.Tests/Soenneker.Sets.Concurrent.Bounded.Tests.csproj --verbosity minimal

      - name: Build tests
        run: dotnet build test/Soenneker.Sets.Concurrent.Bounded.Tests/Soenneker.Sets.Concurrent.Bounded.Tests.csproj --configuration Release --no-restore --verbosity minimal

      - name: Test
        run: dotnet test --project test/Soenneker.Sets.Concurrent.Bounded.Tests/Soenneker.Sets.Concurrent.Bounded.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal

      - name: Restore library
        run: dotnet restore src/Soenneker.Sets.Concurrent.Bounded/Soenneker.Sets.Concurrent.Bounded.csproj --verbosity minimal

      - name: Build library
        run: dotnet build src/Soenneker.Sets.Concurrent.Bounded/Soenneker.Sets.Concurrent.Bounded.csproj --configuration Release --no-restore --verbosity minimal

      - name: Pack
        shell: bash
        run: |
          mkdir -p artifacts
          dotnet pack src/Soenneker.Sets.Concurrent.Bounded/Soenneker.Sets.Concurrent.Bounded.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --output ./artifacts

      - name: Publish to NuGet
        uses: soenneker/nuget-resilient-publish@v4
        with:
          api-key: ${{ secrets.nuget__token }}
          packages: 'artifacts/*.nupkg'

      - name: Add GitHub NuGet Source
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/soenneker/index.json \
            --name "github" \
            --username "any" \
            --password ${{ secrets.GH__TOKEN }} \
            --store-password-in-clear-text

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source "github" \
            --api-key ${{ secrets.GH__TOKEN }}

      - name: Create GitHub Release
        run: |
          changelog="$PACKAGE_RELEASE_NOTES"
          tag_name="v$BUILD_VERSION"

          json_payload=$(
            jq -n \
              --arg tag_name "$tag_name" \
              --arg name "$tag_name" \
              --arg body "$changelog" \
              '{
                tag_name: $tag_name,
                name: $name,
                body: $body,
                draft: false,
                prerelease: false
              }'
          )

          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GH__TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "$json_payload"
